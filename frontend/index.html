<!DOCTYPE html>
<html>
<head>
<title>Nomadic</title>

<link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Nomad</h1>
  <p class="tagline">Personal travel recommender, matched to your vibe.</p>

  <ul id="results"></ul>
  <script src="dist/app.js"></script>
</body>
</html>
